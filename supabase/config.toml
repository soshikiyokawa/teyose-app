# Supabase CLI の設定。
#
# ここに書いた Edge Function は、デプロイのたびにこの設定が使われる。
# 書いていない関数は、いまサーバーに入っている設定のまま変わらない。
#
# verify_jwt = true  … ログインしている人しか呼べない（アプリの画面から使うもの）
# verify_jwt = false … 誰でも呼べる。pg_cron や外部のWebhookから叩くものだけ
#
# 読み取り系（read-receipt / read-quote / read-license）はAI利用料がかかるので、
# 公開されている接続キーだけで呼ばれないよう、必ず true にしておくこと。

project_id = "uotzxrwtzlpdnpfbaqpi"

[functions.read-receipt]
verify_jwt = true

[functions.generate-order-pdf]
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.set-user-password]
verify_jwt = true

[functions.delete-user]
verify_jwt = true

[functions.update-order-price]
verify_jwt = true

[functions.read-invoice]
verify_jwt = true

# pg_cron から呼ぶので verify_jwt は false（x-remind-secret で守る）
[functions.invoice-remind]
verify_jwt = false
